name: Verify JOBMARIO intake
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node tests/client.cjs && node tests/edge.cjs
      - name: Live Supabase smoke test
        run: node tests/live.cjs
