<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOBMARIO für Betriebe</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:35px 20px}.logo{font-size:30px;font-weight:800;color:#1167d8;margin-bottom:28px}.logo span{color:#ff7900}.panel{background:#fff;border-radius:18px;padding:28px;box-shadow:0 5px 25px #0000000f;margin-bottom:20px}h1{font-size:38px;margin:0 0 10px}h2{margin-top:0}.muted{color:#64748b;margin-bottom:24px}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #d6dce6;border-radius:10px;font-size:16px}button,.button{display:inline-block;border:0;border-radius:11px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;background:#1167d8;color:#fff;text-decoration:none;margin-top:16px}.orange{background:#ff7900}.status{margin-top:16px;padding:12px;border-radius:10px;background:#f3f5f8}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main class="wrap"><div class="logo">JOB<span>MARIO</span></div><section class="panel"><h1>Bereich für Betriebe</h1><p class="muted">Einloggen, Firmenprofil anlegen und passende Aufträge verwalten. Kontaktdaten von Kunden bleiben geschützt und werden nur nach freigeschaltetem Lead angezeigt.</p><div id="loginBox"><h2>Mit E-Mail anmelden</h2><label for="authEmail">E-Mail</label><input id="authEmail" type="email" maxlength="254" placeholder="firma@email.de"><button id="loginBtn">Anmeldelink senden</button><div id="authStatus" class="status hidden" role="status"></div></div><div id="accountBox" class="hidden"><h2>Firmenprofil</h2><form id="profileForm"><div class="grid"><div><label for="companyName">Firmenname</label><input id="companyName" minlength="2" maxlength="120" required></div><div><label for="contactName">Ansprechpartner</label><input id="contactName" minlength="2" maxlength="100" required></div><div><label for="companyPhone">Telefon</label><input id="companyPhone" type="tel" minlength="5" maxlength="40" required></div><div><label for="companyPlz">PLZ</label><input id="companyPlz" pattern="[0-9]{5}" maxlength="5" required></div><div><label for="companyCity">Ort</label><input id="companyCity" minlength="2" maxlength="100" required></div><div><label for="trades">Gewerke</label><input id="trades" maxlength="300" placeholder="Trockenbau, Malerarbeiten, Fliesen"></div></div><button class="orange" type="submit">Profil speichern</button><button id="logoutBtn" type="button">Abmelden</button><div id="profileStatus" class="status hidden" role="status"></div></form></div></section><a class="button" href="./">Zurück zu den Aufträgen</a></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="betrieb.js"></script></body></html>
